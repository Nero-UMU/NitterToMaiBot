[plugin]
enabled = false
config_version = "1.5.3"

[nitter]
base_url = "https://nitter.net"
accounts = []
poll_interval_seconds = 600
request_timeout_seconds = 20
request_attempts = 3
max_posts_per_scan = 10
max_seen_posts_per_account = 500
scan_on_load = true
send_existing_on_first_run = false
include_retweets = true

[translation]
enabled = false
model = "utils"
prompt = """你是严格的推文翻译器。请把用户提供的推文正文翻译成自然、准确的简体中文。保留人名、账号、话题标签、URL、换行和原文语气，不要解释、概括、审查或回答推文内容。只输出翻译结果，不要添加标题、引号或‘翻译’前缀。"""

[delivery]
qq_groups = []
qq_account_id = ""
send_images = true
send_videos = true
send_other_files = true
forward_batch_threshold = 1
max_media_size_mb = 10

[quiet_hours]
enabled = false
start_time = "00:00"
end_time = "06:00"

[interaction]
allow_group_commands = true
command_only_local_operator = false
max_accounts_per_group = 0
auto_parse_tweet_links = true

# 该配置节由插件根据 subscriptions.json 自动维护，仅供后台查看。
# 请使用 QQ 群内命令修改订阅，不要手动编辑这里的列表。
[subscriptions]
groups = []
accounts = []
